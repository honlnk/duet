# Duet — Docker Compose 一键部署
# 用法：
#   1. 复制 .env.example 为 .env 并填入 DEEPSEEK_API_KEY
#   2. docker compose up -d --build
#   3. 浏览器访问 http://localhost:3000
services:
  duet:
    build:
      context: .
      dockerfile: Dockerfile
    image: duet:latest
    container_name: duet
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 必填：DeepSeek API Key（也可用下方 env_file 从 .env 读取）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY}
      # 可选：覆盖默认配置（见 .env.example）
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      # 会话数据持久化（容器删除后仍在）
      - duet-data:/data
    # 健康检查（可选，依赖 /api/health 端点）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  duet-data:
