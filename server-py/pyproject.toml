[project]
name = "duet-langgraph"
version = "0.1.0"
description = "duet 后端的 Python + FastAPI + LangGraph 重写版：多 AI 自主对话聊天室"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
duet-langgraph = "duet_langgraph.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duet_langgraph"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# 逐字移植的中文 prompt 文案，不应为行宽折行
"src/duet_langgraph/ai/prompts.py" = ["E501"]
"src/duet_langgraph/agent/prompt.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
